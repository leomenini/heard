[project]
name = "heard"
version = "1.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "evdev>=1.9.3",
    "faster-whisper>=1.2.1",
    "fastembed>=0.7.3",
    "jeepney>=0.9.0",
    "needle",
    "psutil>=7.2.2",
    "rapidfuzz>=3.14.1",
    "sounddevice>=0.5.5",
    "tomli-w>=1.2.0",
    "typer>=0.27.0",
    "gtts>=2.5.4",
]

[project.scripts]
heard = "heard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.16.4",
]

[tool.uv.sources]
needle = { git = "https://github.com/emiliano-go/needle.git", rev = "ffb1c5144c5a16cb8ec650dbc8a6f6fd3854f8f2" }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "PL"]
ignore = [
    "BLE001",  # defensive except-Exception is deliberate around hw/d-bus/IO edges
    "S112",    # silent-continue on unreadable input devices is intended
    "S110",    # focus failure falling back to launch is intended
    "S101",    # asserts in tests
    "S603",    # subprocess with allowlisted binaries is the tool layer's design
    "S607",    # ditto partial executable paths (wpctl/hyprctl/kdotool/swaymsg)
    "S108",    # /tmp fallback for the lockfile when XDG_RUNTIME_DIR is unset
    "PLR2004", # magic numbers are thresholds by nature here
    "PLC0415", # lazy imports keep heavy deps off the hot path
    "PLR0911", "PLR0912", "PLR0915", "PLR0917",  # complexity: small internal tools
    "PLW0603", # module-level announce flag
    "UP042",   # StrEnum would change user-visible detail strings
]

[tool.ruff.lint.per-file-ignores]
# lazy imports keep heavy deps (torch-free startup, hw libs) off the hot path
"heard/**" = ["PLC0415"]
"scripts/**" = ["PLC0415"]
